name: Build

# CI-only feasibility build for ESP32_Host_MIDI on the AciduinoV2Box ESP32-S3.
#
# Why CI: arduino-esp32 3.3.12 pulls ~1.85 GB of toolchains and expands to
# ~3 GB, which did not fit on the local C: drive. GitHub runners have room.
#
# Platform is pinned to 3.3.12 on purpose: the library declares >= 3.0.0, and
# on 2.0.17 src/BLEClientConnection.cpp fails to compile (its ESP_ARDUINO_VERSION
# 2.x branch assumes a BLEAddress ctor that 2.0.17 does not have). Upgrading the
# core -- not patching the library -- is the fix.
#
# Driven through arduino-cli directly instead of arduino/setup-task +
# arduino/compile-action: that pair no longer works. compile-action has been
# removed (folded into compile-sketches, which only emits a JSON report and
# never uploads build output), and setup-task has been reduced to a version
# resolver that accepts only 'version' and 'repo-token' -- it installs nothing,
# so arduino-cli ends up missing from PATH.
on:
  push:
  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: '1.5.1'
  PLATFORM: esp32:esp32@3.3.12
  LIBRARY_REPO: https://github.com/sauloverissimo/ESP32_Host_MIDI.git
  LIBRARY_TAG: v7.3.0
  # 3.x lives on Espressif's index, not downloads.arduino.cc.
  ESP32_INDEX: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

jobs:
  build:
    name: ${{ matrix.sketch }} / esp32s3
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # PSRAM=opi: N16R8 is octal PSRAM, and the generic PSRAM=enabled
          # (quad) leaves the board reset-looping at boot.
          - sketch: ProbeA
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          - sketch: ProbeB
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # Isolation probe: no library, no PSRAM. USBMode=hwcdc puts Serial on
          # the USB-Serial-JTAG peripheral -- the same COM port the ROM
          # downloader uses -- so Windows already has it enumerated and output
          # is capturable without a TinyUSB re-enumeration, and it is not gated
          # on DTR the way TinyUSB CDC is. If this cannot run, the blocker is
          # the USB reset path, not the probe or the PSRAM configuration.
          - sketch: ProbeC
            fqbn: esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # Instrumented probe: DIN-5 MIDI plus the board's real SH1106 OLED and
          # buttons. USBMode=hwcdc keeps Serial on the USB-Serial-JTAG port so a
          # capture is still possible when one can be got; the OLED is I2C and
          # does not care, which is the point -- it reports "RUNNING" with no
          # host involved at all. USB Host MIDI will need USBMode=default later.
          - sketch: ProbeD
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # Dual transport: DIN-5 UART plus BLEClientConnection as BLE central.
          # BLEClientConnection.cpp is the file that failed to compile on 2.0.17,
          # so it is the most fragile thing in the library and the most worth
          # proving on hardware. Registering two transports also checks that
          # midiHandler.task() dispatches to both.
          - sketch: ProbeE
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # BLE the other way round: BLEConnection advertises this board as a
          # GATT server so a phone can connect in as central. ProbeE used
          # BLEClientConnection, which makes the board scan for a peripheral --
          # and iOS forbids apps from advertising as a BLE MIDI peripheral, so
          # that shape can never be tested against a phone.
          - sketch: ProbeF
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # Diagnostic: ProbeF's OLED freezes once a BLE central connects. This
          # one times midiHandler.task() and the OLED transfer separately and
          # counts loop iterations, so the suspected starvation in
          # BLEConnection::processQueue() is measured rather than assumed. The
          # numbers are also on OLED page 1, since the serial terminal was the
          # thing that looked frozen.
          - sketch: ProbeG
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # Isolate the OLED bus cost. ProbeG measured its own unthrottled probe
          # rather than ProbeF, so ProbeF's profile is still unmeasured. This one
          # separates clearBuffer (RAM) from sendBuffer (the bus) at the default
          # speed, explicit 100 kHz and explicit 400 kHz -- the last matching the
          # board's own firmware (AciduinoV2Box oled.cpp:65 setBusClock(400000),
          # which no probe has been doing) -- and checks Wire's error status
          # directly, since U8G2 swallows NACKs.
          - sketch: ProbeH
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          # The application rather than a probe: DIN-5 + BLE driving a real
          # OLED monitor with the board's buttons. Built on what the probes
          # proved rather than re-testing any of it -- in particular ProbeH's
          # finding that a full-buffer redraw costs 31 ms of I2C no matter the
          # bus speed, which is why this one only redraws when the picture has
          # actually changed.
          - sketch: MidiMonitor
            fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_8MB,USBMode=hwcdc,CDCOnBoot=cdc,LoopCore=1,EventsCore=1

    steps:
      - uses: actions/checkout@v4

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          # Keyed on the core version only: that is what dominates the ~3 GB,
          # and including a sketch hash would re-download everything on every
          # probe edit. The library is re-cloned from the pinned tag each run.
          key: arduino-${{ runner.os }}-esp32-3.3.12-${{ env.LIBRARY_TAG }}
          restore-keys: |
            arduino-${{ runner.os }}-esp32-3.3.12-

      - name: Install arduino-cli ${{ env.ARDUINO_CLI_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install arduino-esp32 3.3.12 and ESP32_Host_MIDI
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "$PLATFORM" --additional-urls "$ESP32_INDEX"
          # 'lib install --git-url' is refused by default in arduino-cli 1.5
          # unless sketch.always_allow_unsafe_lib_url is turned on. Cloning the
          # pinned tag into the sketchbook is explicit and needs no such opt-in.
          # The cache covers ~/Arduino/libraries, so the target already exists on
          # a cache hit -- remove it first, git clone refuses a non-empty dir.
          rm -rf "$HOME/Arduino/libraries/ESP32_Host_MIDI"
          git clone --depth 1 --branch "$LIBRARY_TAG" "$LIBRARY_REPO" \
            "$HOME/Arduino/libraries/ESP32_Host_MIDI"
          # Only ProbeD needs this: the board's OLED is a SH1106 on I2C and the
          # project's own port header drives it through U8g2, so match that
          # rather than inventing a second display stack.
          arduino-cli lib install U8g2

      - name: Record resolved environment
        run: |
          arduino-cli version
          echo
          arduino-cli core list
          echo
          arduino-cli lib list | grep -i midi

      - name: Compile ${{ matrix.sketch }}
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --warnings all \
            --export-binaries \
            --build-path build \
            --output-dir out \
            "${{ matrix.sketch }}"

      - name: Collect the four flashable images
        run: |
          set -euo pipefail
          # out/ has the three exported sketch images; boot_app0.bin only exists
          # inside the build tree. Nothing else in build/ is of any use to the
          # board: the rest of it is the intermediate compile tree (objects,
          # static libs, generated headers, CMake logs) and uploading it made
          # the artifact 37 MB, which costs 5-15 minutes per flash iteration on
          # a slow link to use ~1 MB of payload.
          mkdir -p flash
          cp "out/${{ matrix.sketch }}.ino.bin" flash/
          cp "out/${{ matrix.sketch }}.ino.bootloader.bin" flash/
          cp "out/${{ matrix.sketch }}.ino.partitions.bin" flash/
          cp "$(find build -name boot_app0.bin -print -quit)" flash/
          ls -l flash
          sha256sum flash/*

      - uses: actions/upload-artifact@v4
        with:
          name: sketch-build-${{ matrix.sketch }}
          path: flash/
          if-no-files-found: error
